<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0f" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Life Archive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">PRIVATE ACCESS POINT · v1.0</div>
      <h1>LIFE<br>ARCHIVE</h1>
      <p id="intro" class="intro"></p>
      <div class="status"><span></span> Essential information</div>
    </header>

    <section class="card urgent">
      <div class="label">01 / EMERGENCY</div>
      <h2>Call first</h2>
      <div id="contacts" class="stack"></div>
    </section>

    <section class="grid">
      <article class="card">
        <div class="label">02 / MEDICAL</div>
        <div id="medical" class="stack compact"></div>
      </article>
      <article class="card">
        <div class="label">03 / IDENTITY</div>
        <div id="identity" class="stack compact"></div>
      </article>
    </section>

    <section class="card">
      <div class="label">04 / PERSONAL WISHES</div>
      <p id="wishes" class="bodycopy"></p>
    </section>

    <section class="card">
      <div class="label">05 / DOCUMENTS</div>
      <div id="documents" class="stack"></div>
    </section>

    <footer>
      <div>LAST REVIEWED <span id="reviewed"></span></div>
      <div>THIS PAGE IS AN INFORMATION AID, NOT A LEGAL WILL.</div>
    </footer>
  </main>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
